<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid #E2E8F0;
        }
        .ambient-shadow {
            box-shadow: 0 10px 40px -10px rgba(17, 28, 45, 0.1);
        }

<body class="bg-surface font-body-md text-on-surface h-screen flex overflow-hidden">
<!-- Split Screen Layout -->
<div class="flex w-full h-full">
<!-- Left Side: Image/Brand Area -->
<div class="hidden lg:flex lg:w-1/2 relative bg-primary-container items-center justify-center overflow-hidden">
<!-- Background Image -->

</div>

<div class="relative z-10 flex flex-col items-center justify-center p-xl max-w-lg text-center">
<img alt="Daily Flow High Achiever Mode" class="mb-lg w-auto h-16 object-contain filter invert" src="https://lh3.googleusercontent.com/aida/ADBb0ujV17ia6CKgQ_grZSouh9P4dpHQOiObY2HQchNbyQwiff1eNXB4HIPkJqFZJPW950JKxPtGvIWjwBg7qcduKZBTcJ-OvLQzsmNhc7jugtsgzBxPVRPp-KRtuZO5mLBzMkMxltVrZlakJWyzN7f8VhVF08ObTz8cxnXam01B_bvvcUN4JdsMlI099x8CGf9bWElIj6DxKJKQmK3FJNOwiMsuLx5Ui37BF4dwcojHIsoeZReS7V1xH6Hs0hL3VrEwhtKXxdbjCjb6z2Y"/>
<h1 class="font-h1 text-h1 text-on-primary mb-md">High Achiever Mode</h1>
<p class="font-body-lg text-body-lg text-on-primary-container">Unlock your full potential with Daily Flow. Organize, prioritize, and conquer your day with unparalleled clarity.</p>
</div>
<!-- Decorative Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-t from-primary-container via-primary-container/40 to-transparent opacity-90"></div>
</div>
<!-- Right Side: Login Form Area -->
<div class="w-full lg:w-1/2 flex items-center justify-center p-md sm:p-xl bg-surface-container-lowest relative overflow-y-auto">
<!-- Mobile Brand Header (Visible only on small screens) -->
<div class="absolute top-md left-md lg:hidden">
<img alt="Daily Flow Logo" class="h-8 object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uj0rCVilCEuxGDwgKXNxeFcJlwmg1mY1Co23AWh0XhDotSa-WLyi2Pw0R4m3C4tsJYYnB0mOQCCVn0yKlFVHuiecIq2RBlW7a5o5VQaYA-xrOHx7AkkMbejE02zyWQbDjADAmgsBx2w03qrNNpjLI9s4Oir_p2udrD0jksftuT9Q_EqAGwj8IAASLww0ej2QL5nDk4Eryy6BzslOvQ520B6hWyXPNlVE8-nt4GYR5ySUt2tmQu8_H9WyQ5gTZ2FsHu7YGabIuhoBL8"/>
</div>
<!-- Login Card -->
<div class="w-full max-w-md glass-panel rounded-xl p-lg sm:p-xl ambient-shadow">
<div class="text-center mb-xl">
<h2 class="font-h2 text-h2 text-on-surface mb-xs">Welcome back</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to continue your journey.</p>
</div>
<form class="space-y-lg">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-on-surface uppercase block" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-[#E2E8F0] bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-secondary-container focus:ring-2 focus:ring-secondary-container focus:ring-opacity-50 focus:outline-none transition-all placeholder:text-outline-variant" id="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-caps text-label-caps text-on-surface uppercase" for="password">Password</label>
<a class="font-body-sm text-body-sm text-secondary hover:text-secondary-fixed transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline-variant">lock</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-[#E2E8F0] bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-secondary-container focus:ring-2 focus:ring-secondary-container focus:ring-opacity-50 focus:outline-none transition-all placeholder:text-outline-variant" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full py-md bg-primary-container text-on-primary font-button text-button rounded-lg hover:bg-secondary transition-colors duration-200 flex items-center justify-center gap-xs" type="button">
                        Sign In
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="mt-xl mb-lg relative flex items-center">
<div class="flex-grow border-t border-[#E2E8F0]"></div>
<span class="flex-shrink-0 mx-sm font-label-caps text-label-caps text-outline uppercase">Or continue with</span>
<div class="flex-grow border-t border-[#E2E8F0]"></div>
</div>
<!-- Social Login Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-sm px-md rounded-lg border border-[#E2E8F0] bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-on-surface font-button text-button" type="button">
<svg class="w-5 h-5" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                        Google
                    </button>
<button class="flex items-center justify-center gap-sm py-sm px-md rounded-lg border border-[#E2E8F0] bg-surface-container-lowest hover:bg-surface-container-low transition-colors text-on-surface font-button text-button" type="button">
<span class="material-symbols-outlined" data-weight="fill">ios</span>
                        Apple
                    </button>
</div>
<!-- Sign Up Toggle -->
<div class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                        Don't have an account? 
                        <a class="font-button text-button text-secondary hover:text-secondary-fixed transition-colors ml-xs" href="#">Sign Up</a>
</p>
</div>
</div>
</div>
</div>
